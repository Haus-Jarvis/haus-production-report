<style>
:root{--primary:#7C3AED;--primary-md:#A78BFA;--primary-lt:#EDE9FE;--bg:#F8FAFC;--card:#FFF;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--t1);font-size:14px}
.num{font-family:'JetBrains Mono',monospace}
.layout{display:flex;min-height:100vh}
.sidebar{width:228px;background:var(--card);border-right:1px solid var(--border);position:fixed;height:100vh;overflow-y:auto}
.sb-logo{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
.sb-logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#7C3AED,#A78BFA);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
.sb-logo-txt b{font-size:15px}.sb-logo-txt span{font-size:11px;color:var(--t3);display:block}
.sb-section-label{padding:16px 20px 7px;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
.tab-btn{width:100%;text-align:left;padding:11px 20px;border:none;background:none;cursor:pointer;display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--t2);font-weight:500;transition:all .13s;border-left:3px solid transparent;font-family:inherit}
.tab-btn:hover{background:var(--primary-lt)}
.tab-btn.active{background:var(--primary-lt);color:var(--primary);font-weight:700;border-left-color:var(--primary)}
.tb-icon{font-size:15px}.tb-badge{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:9px;background:var(--border);color:var(--t2);font-family:'JetBrains Mono'}
.sb-footer{padding:16px 20px;border-top:1px solid var(--border);margin-top:8px;font-size:11px;color:var(--t3)}
.sb-rrow{display:flex;justify-content:space-between;margin-bottom:5px}.sb-rval{font-family:'JetBrains Mono';font-weight:700;color:var(--t2)}
.main{flex:1;margin-left:228px}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:15px 28px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:20}
.tb-title{font-size:17px;font-weight:800}
.tb-tag{font-size:11px;padding:3px 10px;border-radius:6px;background:var(--primary-lt);color:var(--primary);font-weight:600}
.ver-badge{font-size:10px;font-family:'JetBrains Mono';color:var(--t2);padding:2px 7px;border:1px solid var(--border);border-radius:4px;margin-left:8px}
.lang-sel{display:flex;align-items:center;gap:3px;margin-left:8px}
.lang-btn{padding:4px 9px;border:1px solid var(--border);border-radius:5px;background:none;cursor:pointer;font-size:11px;font-weight:700;color:var(--t2);transition:all .15s;font-family:inherit}
.lang-btn:hover{border-color:var(--primary-md);color:var(--primary)}
.lang-btn.lact{background:var(--primary-md);border-color:var(--primary-md);color:#fff}
.lang-sep{font-size:10px;color:var(--t3)}
.tb-meta{margin-left:auto;font-size:12px;color:var(--t3);font-family:'JetBrains Mono'}
.content-area{padding:24px 28px;max-width:1300px}
.tab-panel{display:none}.tab-panel.active{display:block}
.sec-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin:22px 0 13px;padding-left:9px;border-left:3px solid var(--primary)}
.sec-label:first-child{margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin-bottom:8px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;border-top:3px solid var(--accent,var(--primary))}
.kpi-label{font-size:12px;color:var(--t2);font-weight:600;margin-bottom:7px}
.kpi-value{font-size:26px;font-weight:800;font-family:'JetBrains Mono'}
.kpi-value .unit{font-size:14px;color:var(--t3);font-weight:600}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.card-title{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-sub{font-size:11.5px;color:var(--t3);margin-bottom:15px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.row-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.toggle-row{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;align-items:center}
.toggle-group{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tg-btn{padding:7px 14px;border:none;background:var(--card);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--t2);transition:all .13s;font-family:inherit}
.tg-btn:not(:last-child){border-right:1px solid var(--border)}
.tg-btn.on{background:var(--primary);color:#fff}
.tg-label{font-size:11px;color:var(--t3);font-weight:600;margin-right:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
thead th{background:#F1F5F9;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.02em}
tbody tr:hover{background:var(--primary-lt)}
.tot-row{font-weight:700;background:#FFF7ED}.tot-row td{border-top:2px solid var(--primary-md)}
.hl-pill{font-size:10px;padding:1px 7px;border-radius:9px;background:#EDE9FE;color:#6D28D9;font-weight:600}
.manual-pill{font-size:10px;padding:1px 7px;border-radius:9px;background:#FEF3C7;color:#B45309;font-weight:600}
.notice{border-left:3px solid #F59E0B;background:#FFFBEB;padding:14px 18px;border-radius:8px;margin-bottom:18px;font-size:12.5px;color:#92400E}
@media(max-width:980px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.row-2{grid-template-columns:1fr}}

  const t=I18N[window._lang]||I18N.ko;
  const mw=D.f0.manual_worker_task;
  let h='';
  if(v==='monthly'){
    h='<table><thead><tr><th>'+t['tech']+'</th>';D.months.forEach(m=>h+='<th>'+monthLabel(m)+'</th>');h+='<th>YTD</th></tr></thead><tbody>';
    let colT={};D.months.forEach(m=>colT[m]=0);let gT=0;
    D.workers.forEach(w=>{let rt=0;h+='<tr><td>'+w+'</td>';D.months.forEach(m=>{const val=mtasks.reduce((s,tk)=>s+(mw[m][w][tk]||0),0);colT[m]+=val;rt+=val;h+='<td class="num">'+(val||'-')+'</td>';});gT+=rt;h+='<td class="num" style="font-weight:700;color:#F59E0B">'+fmt(rt)+'</td></tr>';});
    h+='<tr class="tot-row"><td>'+t['total']+'</td>';D.months.forEach(m=>h+='<td class="num">'+fmt(colT[m])+'</td>');h+='<td class="num">'+fmt(gT)+'</td></tr></tbody></table>';
  } else {
    const isMonth=D.months.includes(v);
    h='<table><thead><tr><th>'+t['tech']+'</th>';mtasks.forEach(tk=>h+='<th>'+tk+'</th>');h+='<th>Total</th></tr></thead><tbody>';
    let colT={};mtasks.forEach(tk=>colT[tk]=0);let gT=0;
    D.workers.forEach(w=>{let rt=0;h+='<tr><td>'+w+'</td>';mtasks.forEach(tk=>{let val;if(isMonth){val=mw[v][w][tk]||0;}else{val=Math.round(D.months.reduce((s,m)=>s+(mw[m][w][tk]||0),0)/D.months.length);}colT[tk]+=val;rt+=val;h+='<td class="num">'+(val||'-')+'</td>';});gT+=rt;h+='<td class="num" style="font-weight:700;color:#F59E0B">'+fmt(rt)+'</td></tr>';});
    h+='<tr class="tot-row"><td>'+t['total']+'</td>';mtasks.forEach(tk=>h+='<td class="num">'+fmt(colT[tk])+'</td>');h+='<td class="num">'+fmt(gT)+'</td></tr></tbody></table>';
  }
  return h;
}

let f5metric='per_hr'; // per_hr | per_day
function tabF5(){
  const t=I18N[window._lang]||I18N.ko;
  return `<div class="tab-panel active">
    <div class="sec-label">${t['page-5']}</div>
    <div class="card" style="padding:13px 18px;background:#FAFAFA"><div style="font-size:12px;color:var(--t2)">${t['f5-info']}</div></div>

    <div class="toggle-row">
      <span class="tg-label">${t['tg-metric']}</span>
      <div class="toggle-group">
        <button class="tg-btn on" id="f5-per_hr" onclick="setF5Metric('per_hr')">${t['m-perhr']}</button>
        <button class="tg-btn" id="f5-per_day" onclick="setF5Metric('per_day')">${t['m-perday']}</button>
      </div>
    </div>
    <div class="card"><div class="card-title"><span class="dot" style="background:#7C3AED"></span><span id="f5-ctitle"></span></div>

      <div style="position:relative;height:320px"><canvas id="f5Chart"></canvas></div></div>
    <div class="card"><div class="card-title"><span class="dot" style="background:#A78BFA"></span>${t['f5-detail']}</div>
      <div class="card-sub">${t['f5-detail-sub']}</div>
      <div id="f5-table"></div></div>
  </div>`;
}
function setF5Metric(m){f5metric=m;['per_hr','per_day'].forEach(x=>document.getElementById('f5-'+x).classList.toggle('on',x===m));drawF5();}
function drawF5(){
  const t=I18N[window._lang]||I18N.ko;
  if(charts.f5)charts.f5.destroy();
  const metric=f5metric;
  // 시간 데이터 있는 테크니션만 차트
  const timed=D.workers.filter(w=>D.months.some(m=>D.f5[m][w].has_time));
  document.getElementById('f5-ctitle').textContent=(metric==='per_hr'?t['ct-perhr']:t['ct-perday']);
  document.getElementById('f5-csub').textContent=t['f5-csub2'];
  charts.f5=new Chart(document.getElementById('f5Chart'),{type:'line',
    data:{labels:D.months.map(monthLabel),datasets:timed.map(w=>({label:wshort(w),data:D.months.map(m=>D.f5[m][w][metric]||0),borderColor:WORKER_COLOR[w],backgroundColor:WORKER_COLOR[w]+'22',borderWidth:2.5,pointRadius:4,pointHoverRadius:6,pointBackgroundColor:WORKER_COLOR[w],tension:0.3,fill:false}))},
    options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'#F1F5F9'},title:{display:true,text:metric==='per_hr'?t['unit-perhr']:t['unit-perday']}}},plugins:{legend:{position:'top'}}}});
  // 상세 표: 테크니션별 월별 (Unit / Hrs / per_hr / per_day)
  let h='<table><thead><tr><th>'+t['tech']+'</th><th>'+t['metric-col']+'</th>';
  D.months.forEach(m=>h+='<th>'+monthLabel(m)+'</th>');h+='<th>YTD/'+t['avg']+'</th></tr></thead><tbody>';
  D.workers.forEach(w=>{
    const hasAny=D.months.some(m=>D.f5[m][w].has_time);
    // Unit 행
    let uy=0;h+='<tr><td rowspan="'+(hasAny?4:1)+'" style="font-weight:600">'+w+(hasAny?'':' <span class="manual-pill">'+t['no-time']+'</span>')+'</td><td style="color:#7C3AED">Unit</td>';
    D.months.forEach(m=>{const v=D.f5[m][w].unit;uy+=v;h+='<td class="num">'+fmt(v)+'</td>';});h+='<td class="num" style="font-weight:700">'+fmt(uy)+'</td></tr>';
    if(hasAny){
      // Total Hrs
      let hy=0;h+='<tr><td style="color:#475569">Total Hrs</td>';D.months.forEach(m=>{const v=D.f5[m][w].total_hrs;if(v)hy+=v;h+='<td class="num">'+(v!=null?v.toFixed(1):'-')+'</td>';});h+='<td class="num" style="font-weight:700">'+hy.toFixed(1)+'</td></tr>';
      // per_hr
      h+='<tr style="background:#F5F3FF"><td style="color:#7C3AED;font-weight:600">Fin/Hour</td>';D.months.forEach(m=>{const v=D.f5[m][w].per_hr;h+='<td class="num" style="font-weight:700;color:#7C3AED">'+(v!=null?v.toFixed(2):'-')+'</td>';});const avgH=hy?(uy/hy):0;h+='<td class="num" style="font-weight:700;color:#7C3AED">'+avgH.toFixed(2)+'</td></tr>';
      // per_day
      h+='<tr><td style="color:#F59E0B;font-weight:600">Fin/Day</td>';D.months.forEach(m=>{const v=D.f5[m][w].per_day;h+='<td class="num" style="color:#B45309">'+(v!=null?v.toFixed(1):'-')+'</td>';});const avgD=hy?(uy/(hy/8)):0;h+='<td class="num" style="color:#B45309">'+avgD.toFixed(1)+'</td></tr>';
    }
  });
  h+='</tbody></table>';
  document.getElementById('f5-table').innerHTML=h;
}

                   .replace(/÷\s*6(\s*개월)?/g, '÷ '+N+(RegExp.$1?'개월':''));
        });
      }); }
    }catch(e){}
    /* B) DOM 텍스트 노드의 고정 라벨 치환 */
    try{
      var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n,arr=[];
      while(n=w.nextNode())arr.push(n);
      arr.forEach(function(nd){
        var p=nd.parentNode; if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'))return;
        var v=nd.nodeValue, o=v;
        v=v.replace(/Jan\s*[~\-–]\s*(?:Feb|Mar|Apr|May|Jun)/g, first+'~'+last)
           .replace(/1월\s*[~\-–]\s*[2-6]월/g, '1월~'+(KO[last]||last))
           .replace(/Ene\s*[~\-–]\s*(?:Feb|Mar|Abr|May|Jun)/g, first+'~'+last)
           .replace(/÷\s*[2-9]\s*개월/g, '÷ '+N+'개월')
           .replace(/÷\s*[2-9](?!\d)/g, '÷ '+N);
        if(v!==o)nd.nodeValue=v;
      });
    }catch(e){}
  }
  window.__fixMonthLabels=run;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(run,120);});
  else setTimeout(run,120);
  [400,900,1500].forEach(function(ms){setTimeout(run,ms);});
  ['setLang','sw','switchSheet','switchTab','showSheet','goSheet'].forEach(function(nm){
    var f=window[nm];
    if(typeof f==='function'){window[nm]=function(){var r=f.apply(this,arguments);setTimeout(run,60);return r;};}
  });
})();


/* ===== [부서 KPI 자동 재계산] D.months 기준 · 수기 포함 ===== */
(function(){
  function totals(){
    try{
      var MS=D.months, N=MS.length;
      if(D.m0&&D.m0.haus)            return MS.map(function(m,i){return (D.m0.haus[i]||0)+((D.m0.manual||[])[i]||0);});
      if(D.f0&&D.f0.combined_total)  return MS.map(function(m){return D.f0.combined_total[m]||0;});
      if(D.combined_total&&D.opts)   return MS.map(function(m){return D.combined_total[m]||0;});
      if(D.hl&&D.man)                return MS.map(function(m,i){
          var a=0,b=0; Object.keys(D.hl).forEach(function(k){a+=(D.hl[k][i]||0);});
          Object.keys(D.man).forEach(function(k){b+=(D.man[k][i]||0);}); return a+b;});
      if(D.d0month)                  return MS.map(function(m,i){
          return ['ih_hl','ih_su','os_hl','os_su'].reduce(function(a,k){return a+((D.d0month[k]||[])[i]||0);},0);});
      if(D.dept&&D.dept.hl)          return MS.map(function(m,i){return (D.dept.hl[i]||0)+((D.dept.su||[])[i]||0);});
    }catch(e){}
    return null;
  }
  function nf(n){return Math.round(n).toLocaleString();}
  function run(){
    if(typeof D==='undefined'||!D.months)return;
    var T=totals(); if(!T)return;
    var N=D.months.length, MS=D.months;
    var KO={'Jan':'1월','Feb':'2월','Mar':'3월','Apr':'4월','May':'5월','Jun':'6월','June':'6월',
            'Jul':'7월','Aug':'8월','Sep':'9월','Oct':'10월','Nov':'11월','Dec':'12월'};
    var ko=(window._lang||'ko')==='ko';
    var sum=T.reduce(function(a,b){return a+(b||0);},0), avg=sum/N;
    var cur=T[N-1]||0, prev=T[N-2]||0;
    var g=prev?((cur-prev)/prev*100):0, va=avg?((cur-avg)/avg*100):0;
    var curL=ko?(KO[MS[N-1]]||MS[N-1]):MS[N-1], prvL=ko?(KO[MS[N-2]]||MS[N-2]):MS[N-2];
    var span=ko?('1월~'+(KO[MS[N-1]]||MS[N-1])):(MS[0]+'~'+MS[N-1]);
    var avgW=ko?'월평균':'Mo.Avg', prvW=ko?'직전월':'Prev Mo';
    var row=document.querySelector('.kpi-row')||document.querySelector('.kpi-grid'); if(!row)return;
    var cards=[].slice.call(row.querySelectorAll('.kpi,.kpi-card'));
    function setC(c,val,sub,lbl){
      if(!c)return;
      var v=c.querySelector('.kpi-val,.kpi-big,.kpi-value'); if(v)v.textContent=val;
      var s=c.querySelector('.kpi-sub,.kpi-s'); if(s){s.textContent=sub;s.removeAttribute('data-i18n');}
      if(lbl){var l=c.querySelector('.kpi-lbl,.kpi-l,.kpi-label'); if(l){l.textContent=lbl;l.removeAttribute('data-i18n');}}
    }
    var lblCur=ko?('당월('+curL+') 생산량 (Haus Link + 로컬/수기)')
                 :('Current Mo ('+curL+') Output (Haus Link + Manual)');
    setC(cards[0], nf(sum), avgW+' '+nf(avg)+' · '+span);
    setC(cards[1], nf(cur), prvW+'('+prvL+') '+nf(prev), lblCur);
    if(cards[2]){
      var vv=cards[2].querySelector('.kpi-val,.kpi-big,.kpi-value');
      if(vv){vv.textContent=(g>=0?'+':'')+g.toFixed(1)+'%';vv.style.color=g>=0?'#16A34A':'#DC2626';}
      var ss=cards[2].querySelector('.kpi-sub,.kpi-s');
      if(ss){ss.textContent=(cur-prev>=0?'▲ ':'▼ ')+nf(Math.abs(cur-prev))+' units';ss.removeAttribute('data-i18n');}
    }
    if(cards[3]){
      var v4=cards[3].querySelector('.kpi-val,.kpi-big,.kpi-value');
      if(v4){v4.textContent=(va>=0?'+':'')+va.toFixed(1)+'%';v4.style.color=va>=0?'#16A34A':'#DC2626';}
      var s4=cards[3].querySelector('.kpi-sub,.kpi-s');
      if(s4){s4.textContent=avgW+' '+nf(avg)+' → '+curL+' '+nf(cur);s4.removeAttribute('data-i18n');}
    }
    /* 사이드바 YTD / 기간 */
    document.querySelectorAll('.mill-sb-val,.sb-rval,.sb-val').forEach(function(el){
      var t=(el.textContent||'').trim();
      if(/^[\d,]+$/.test(t)&&Math.abs(parseInt(t.replace(/,/g,''))-sum)>0) el.textContent=nf(sum);
      else if(/[~\-–]/.test(t)&&/(Jan|1월|Ene)/.test(t)) el.textContent=span+(/\d{4}/.test(t)?' 2026':'');
    });
  }
  window.__renderDeptKPI=run;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(run,180);});
  else setTimeout(run,180);
  [500,1000,1600].forEach(function(ms){setTimeout(run,ms);});
  ['setLang','sw','switchSheet','switchTab','showSheet','goSheet'].forEach(function(nm){
    var f=window[nm];
    if(typeof f==='function'){window[nm]=function(){var r=f.apply(this,arguments);setTimeout(run,80);return r;};}
  });
})();

</script>

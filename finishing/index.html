function sweepDOM(){if(_SWP)return;_SWP=true;try{var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),a=[],n;while(n=w.nextNode())a.push(n);for(var i=0;i<a.length;i++){var nd=a[i],p=nd.parentNode;if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'))continue;if(p&&p.closest&&p.closest('[data-i18n]'))continue;if(!_ORIG.has(nd))_ORIG.set(nd,nd.nodeValue);var o=_ORIG.get(nd),v=(_lng()==='ko')?o:_tr(o);if(nd.nodeValue!==v)nd.nodeValue=v;}}finally{_SWP=false;}}
function sweepCharts(){try{if(typeof charts==='undefined'||!charts)return;Object.keys(charts).forEach(function(k){var c=charts[k];if(!c||!c.data)return;var ch=false;
if(c.data.datasets)c.data.datasets.forEach(function(ds){if(ds._ko===undefined)ds._ko=ds.label;if(ds._ko!=null){var nv=_tr(ds._ko);if(ds.label!==nv){ds.label=nv;ch=true;}}});
if(c.data._kl===undefined)c.data._kl=Array.isArray(c.data.labels)?c.data.labels.slice():null;
if(c.data._kl){for(var z=0;z<c.data.labels.length;z++){var o=c.data._kl[z];if(o&&/[가-힣]/.test(o)){var nv=_tr(o);if(c.data.labels[z]!==nv){c.data.labels[z]=nv;ch=true;}}}}
if(ch&&c.update)c.update('none');});}catch(e){}}
function sweepAll(){sweepDOM();sweepCharts();}
try{var _OBS=new MutationObserver(function(ms){if(_SWP)return;for(var i=0;i<ms.length;i++){if(ms[i].addedNodes.length||ms[i].type==='characterData'){sweepDOM();return;}}});_OBS.observe(document.body,{childList:true,subtree:true,characterData:true});}catch(e){}
(function(){if(typeof setLang==='function'){var _o=setLang;setLang=function(){_o.apply(this,arguments);sweepAll();};}})();
setTimeout(sweepAll,80);setTimeout(sweepAll,400);;(function(){var _done=false,_t=null;function _r(){if(_done)return;var w=document.documentElement.clientWidth||0;if(w<=0)return;_done=true;clearTimeout(_t);_t=setTimeout(function(){try{setLang(document.documentElement.lang||'en');}catch(e){}},40);}if((document.documentElement.clientWidth||0)>0){_done=true;}window.__rdSafe=_r;if(window.ResizeObserver){try{new ResizeObserver(_r).observe(document.documentElement);}catch(e){}}})();
/* ===== end i18n sweep ===== */


/* ===== [월 동적화] D.months 기준으로 월 버튼 재생성 ===== */
(function(){
  function KO(){try{return (window._lang||'ko')==='ko';}catch(e){return true;}}
  function lbl(m,i,ko){
    try{var t=(typeof I18N!=='undefined')&&I18N[window._lang||'ko'];
        if(t&&t.mm&&t.mm[m])return t.mm[m];}catch(e){}
    var ko_txt=(i+1)+'월';
    /* GLOSS 번역기가 있으면 현재 언어로 변환 (sweep 종료 후에도 정확) */
    try{ if(typeof _tr==='function'){var r=_tr(ko_txt); if(r&&r!==ko_txt) return r; } }catch(e){}
    if(ko===undefined) ko=KO();
    return ko? ko_txt : m;
  }
  window.__monLabel=lbl;
  function rebuild(){
    if(typeof D==='undefined'||!D.months)return;
    var MS=D.months;
    /* A) tog-grp 형태 (Milling): YTD 등 비월 버튼 유지 + 월버튼 재생성 */
    document.querySelectorAll('.tog-grp').forEach(function(g){
      var bs=[].slice.call(g.querySelectorAll('button'));
      if(!bs.length)return;
      var isMon=function(b){return /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|1월|2월|3월|4월|5월|6월|7월|8월|9월|10월|11월|12월)$/.test((b.textContent||'').trim());};
      var monBtns=bs.filter(isMon); if(!monBtns.length)return;
      var oc=monBtns[0].getAttribute('onclick')||'';
      var fn=(oc.match(/^\s*([A-Za-z_$][\w$]*)\s*\(/)||[])[1]; if(!fn)return;
      var keep=bs.filter(function(b){return !isMon(b);});
      var _ko=/월$/.test((monBtns[0].textContent||'').trim());
      var html='';
      keep.forEach(function(b){html+=b.outerHTML;});
      MS.forEach(function(m,i){
        var key=m.toLowerCase().slice(0,3);
        html+='<button class="tog" onclick="'+fn+'(\''+key+'\',this)">'+lbl(m,i,_ko)+'</button>';
      });
      g.innerHTML=html;
    });
    /* B) mbtn 형태 (Design/Scan): 컨테이너별 인덱스 기반 */
    document.querySelectorAll('[id$="-months"]').forEach(function(c){
      var bs=[].slice.call(c.querySelectorAll('.mbtn'));
      if(!bs.length)return;
      var oc=bs[0].getAttribute('onclick')||'';
      var fn=(oc.match(/^\s*([A-Za-z_$][\w$]*)\s*\(/)||[])[1]; if(!fn)return;
      var _ko2=/월$/.test((bs[0].textContent||'').trim());
      var act=bs.findIndex(function(b){return b.classList.contains('active');});
      if(act<0)act=0; if(act>=MS.length)act=MS.length-1;
      var html='';
      MS.forEach(function(m,i){
        html+='<button class="mbtn'+(i===act?' active':'')+'" onclick="'+fn+'('+i+')">'+lbl(m,i,_ko2)+'</button>';
      });
      c.innerHTML=html;
    });
  }
  window.__rebuildMonths=rebuild;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(rebuild,60);});
  else setTimeout(rebuild,60);
  /* 탭 전환 후에도 재적용 */

  ['sw','switchSheet','switchTab','setLang','showSheet','goSheet'].forEach(function(n){
    var f=window[n];
    if(typeof f==='function'&&!f.__mwrap){
      var w=function(){var r=f.apply(this,arguments);setTimeout(rebuild,30);setTimeout(rebuild,150);return r;};
      w.__mwrap=1; window[n]=w;
    }
  });
  [200,600,1200].forEach(function(ms){setTimeout(rebuild,ms);});

})();


/* ===== [월 라벨 동적화] D.months 기준으로 고정 라벨 자동 교정 ===== */
(function(){
  function run(){
    if(typeof D==='undefined'||!D.months||!D.months.length)return;
    var MS=D.months, N=MS.length, first=MS[0], last=MS[N-1];
    var KO={'Jan':'1월','Feb':'2월','Mar':'3월','Apr':'4월','May':'5월','Jun':'6월','June':'6월',
            'Jul':'7월','Aug':'8월','Sep':'9월','Oct':'10월','Nov':'11월','Dec':'12월'};
    /* A) I18N 의 months 배열을 실제 월 수에 맞춤 */
    try{ if(typeof I18N==='object'){ Object.keys(I18N).forEach(function(lg){
        var t=I18N[lg]; if(!t)return;
        if(Array.isArray(t.months)&&t.months.length<N){
          var cur=t.months.slice();
          for(var i=cur.length;i<N;i++) cur.push(lg==='ko'?(KO[MS[i]]||MS[i]):MS[i]);
          t.months=cur;
        }
        /* 문자열 값 안의 고정 구간 라벨 치환 */
        Object.keys(t).forEach(function(k){
          if(typeof t[k]!=='string')return;
          t[k]=t[k].replace(/Jan\s*[~\-–]\s*(?:Feb|Mar|Apr|May|Jun)/g, first+'~'+last)
                   .replace(/1월\s*[~\-–]\s*[2-6]월/g, '1월~'+(KO[last]||last))
                   .replace(/Ene\s*[~\-–]\s*(?:Feb|Mar|Abr|May|Jun)/g, first+'~'+last)
                   .replace(/÷\s*5(\s*개월)?/g, '÷ '+N+(RegExp.$1?'개월':''))
                   .replace(/÷\s*6(\s*개월)?/g, '÷ '+N+(RegExp.$1?'개월':''));
        });
      }); }
    }catch(e){}
    /* B) DOM 텍스트 노드의 고정 라벨 치환 */
    try{
      var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n,arr=[];
      while(n=w.nextNode())arr.push(n);
      arr.forEach(function(nd){
        var p=nd.parentNode; if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'))return;
        var v=nd.nodeValue, o=v;
        v=v.replace(/Jan\s*[~\-–]\s*(?:Feb|Mar|Apr|May|Jun)/g, first+'~'+last)
           .replace(/1월\s*[~\-–]\s*[2-6]월/g, '1월~'+(KO[last]||last))
           .replace(/Ene\s*[~\-–]\s*(?:Feb|Mar|Abr|May|Jun)/g, first+'~'+last)
           .replace(/÷\s*[2-9]\s*개월/g, '÷ '+N+'개월')
           .replace(/÷\s*[2-9](?!\d)/g, '÷ '+N);
        if(v!==o)nd.nodeValue=v;
      });
    }catch(e){}
  }
  window.__fixMonthLabels=run;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(run,120);});
  else setTimeout(run,120);
  [400,900,1500].forEach(function(ms){setTimeout(run,ms);});
  ['setLang','sw','switchSheet','switchTab','showSheet','goSheet'].forEach(function(nm){
    var f=window[nm];
    if(typeof f==='function'){window[nm]=function(){var r=f.apply(this,arguments);setTimeout(run,60);return r;};}
  });
})();


/* ===== [부서 KPI 자동 재계산] D.months 기준 · 수기 포함 ===== */
(function(){
  function totals(){
    try{
      var MS=D.months, N=MS.length;
      if(D.m0&&D.m0.haus)            return MS.map(function(m,i){return (D.m0.haus[i]||0)+((D.m0.manual||[])[i]||0);});
      if(D.f0&&D.f0.combined_total)  return MS.map(function(m){return D.f0.combined_total[m]||0;});
      if(D.combined_total&&D.opts)   return MS.map(function(m){return D.combined_total[m]||0;});
      if(D.hl&&D.man)                return MS.map(function(m,i){
          var a=0,b=0; Object.keys(D.hl).forEach(function(k){a+=(D.hl[k][i]||0);});
          Object.keys(D.man).forEach(function(k){b+=(D.man[k][i]||0);}); return a+b;});
      if(D.d0month)                  return MS.map(function(m,i){
          return ['ih_hl','ih_su','os_hl','os_su'].reduce(function(a,k){return a+((D.d0month[k]||[])[i]||0);},0);});
      if(D.dept&&D.dept.hl)          return MS.map(function(m,i){return (D.dept.hl[i]||0)+((D.dept.su||[])[i]||0);});
    }catch(e){}
    return null;
  }
  function nf(n){return Math.round(n).toLocaleString();}
  function run(){
    if(typeof D==='undefined'||!D.months)return;
    var T=totals(); if(!T)return;
    var N=D.months.length, MS=D.months;
    var KO={'Jan':'1월','Feb':'2월','Mar':'3월','Apr':'4월','May':'5월','Jun':'6월','June':'6월',
            'Jul':'7월','Aug':'8월','Sep':'9월','Oct':'10월','Nov':'11월','Dec':'12월'};
    var ko=(window._lang||'ko')==='ko';
    var sum=T.reduce(function(a,b){return a+(b||0);},0), avg=sum/N;
    var cur=T[N-1]||0, prev=T[N-2]||0;
    var g=prev?((cur-prev)/prev*100):0, va=avg?((cur-avg)/avg*100):0;
    var curL=ko?(KO[MS[N-1]]||MS[N-1]):MS[N-1], prvL=ko?(KO[MS[N-2]]||MS[N-2]):MS[N-2];
    var span=ko?('1월~'+(KO[MS[N-1]]||MS[N-1])):(MS[0]+'~'+MS[N-1]);
    var avgW=ko?'월평균':'Mo.Avg', prvW=ko?'직전월':'Prev Mo';
    var row=document.querySelector('.kpi-row')||document.querySelector('.kpi-grid'); if(!row)return;
    var cards=[].slice.call(row.querySelectorAll('.kpi,.kpi-card'));
    function setC(c,val,sub,lbl){
      if(!c)return;
      var v=c.querySelector('.kpi-val,.kpi-big,.kpi-value'); if(v)v.textContent=val;
      var s=c.querySelector('.kpi-sub,.kpi-s'); if(s){s.textContent=sub;s.removeAttribute('data-i18n');}
      if(lbl){var l=c.querySelector('.kpi-lbl,.kpi-l,.kpi-label'); if(l){l.textContent=lbl;l.removeAttribute('data-i18n');}}
    }
    var lblCur=ko?('당월('+curL+') 생산량 (Haus Link + 로컬/수기)')
                 :('Current Mo ('+curL+') Output (Haus Link + Manual)');
    setC(cards[0], nf(sum), avgW+' '+nf(avg)+' · '+span);
    setC(cards[1], nf(cur), prvW+'('+prvL+') '+nf(prev), lblCur);
    if(cards[2]){
      var vv=cards[2].querySelector('.kpi-val,.kpi-big,.kpi-value');
      if(vv){vv.textContent=(g>=0?'+':'')+g.toFixed(1)+'%';vv.style.color=g>=0?'#16A34A':'#DC2626';}
      var ss=cards[2].querySelector('.kpi-sub,.kpi-s');
      if(ss){ss.textContent=(cur-prev>=0?'▲ ':'▼ ')+nf(Math.abs(cur-prev))+' units';ss.removeAttribute('data-i18n');}
    }
    if(cards[3]){
      var v4=cards[3].querySelector('.kpi-val,.kpi-big,.kpi-value');
      if(v4){v4.textContent=(va>=0?'+':'')+va.toFixed(1)+'%';v4.style.color=va>=0?'#16A34A':'#DC2626';}
      var s4=cards[3].querySelector('.kpi-sub,.kpi-s');
      if(s4){s4.textContent=avgW+' '+nf(avg)+' → '+curL+' '+nf(cur);s4.removeAttribute('data-i18n');}
    }
    /* 사이드바 YTD / 기간 */
    document.querySelectorAll('.mill-sb-val,.sb-rval,.sb-val').forEach(function(el){
      var t=(el.textContent||'').trim();
      if(/^[\d,]+$/.test(t)&&Math.abs(parseInt(t.replace(/,/g,''))-sum)>0) el.textContent=nf(sum);
      else if(/[~\-–]/.test(t)&&/(Jan|1월|Ene)/.test(t)) el.textContent=span+(/\d{4}/.test(t)?' 2026':'');
    });
  }
  window.__renderDeptKPI=run;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(run,180);});
  else setTimeout(run,180);
  [500,1000,1600].forEach(function(ms){setTimeout(run,ms);});
  ['setLang','sw','switchSheet','switchTab','showSheet','goSheet'].forEach(function(nm){
    var f=window[nm];
    if(typeof f==='function'){window[nm]=function(){var r=f.apply(this,arguments);setTimeout(run,80);return r;};}
  });
})();

</script>
